[package]
name = "zore"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.98"
description = "The Zore bootstrap compiler"
license = "Apache-2.0"
repository = "https://github.com/maasdi/zore"
homepage = "https://github.com/maasdi/zore"
readme = "../README.md"
keywords = ["compiler", "programming-language", "ownership", "llvm"]
categories = ["compilers", "command-line-utilities"]
# Not published to crates.io while the language is pre-release.
publish = false

autotests = false

[dependencies]
sha2 = "0.10"
spdx = { version = "0.13", default-features = false }

[[example]]
name = "async_frame_scaling"
path = "../benchmarks/frame-storage/scaling/main.rs"

[[example]]
name = "compile_profile"
path = "../benchmarks/performance/stages.rs"

