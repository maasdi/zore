name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * 1'

permissions:
  contents: read

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routes:
    name: Select CI routes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.routes.outputs.full }}
      docs: ${{ steps.routes.outputs.docs }}
      benchmarks: ${{ steps.routes.outputs.benchmarks }}
      distribution: ${{ steps.routes.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test routing rules and gates
        run: python -m unittest discover -s .github/scripts -p test_ci_routing.py
      - name: Select checks
        id: routes
        run: python .github/scripts/ci_routing.py

  validation:
    needs: routes
    if: needs.routes.outputs.full == 'true' || needs.routes.outputs.benchmarks == 'true'
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Windows native toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select Windows clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"ZORE_CC=C:\Program Files\LLVM\bin\clang.exe" >> $env:GITHUB_ENV'
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        if: needs.routes.outputs.full == 'true'
        run: cargo fmt --all -- --check
      - name: Lint
        if: needs.routes.outputs.full == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint native example bridge
        if: needs.routes.outputs.full == 'true'
        run: cargo clippy --locked -p zore-runtime --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg zore_native_adapters
          ZORE_NATIVE_ADAPTERS: ${{ github.workspace }}/examples/native-library/adler32/native/registration.rs
      - name: Lint SQLite bridge
        if: needs.routes.outputs.full == 'true'
        run: cargo clippy --locked -p zore-runtime --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg zore_native_adapters
          ZORE_NATIVE_ADAPTERS: ${{ github.workspace }}/packages/sqlite/native/registration.rs
      - name: Lint TLS bridge
        if: needs.routes.outputs.full == 'true'
        run: cargo clippy --locked -p zore-runtime --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg zore_native_adapters
          ZORE_NATIVE_ADAPTERS: ${{ github.workspace }}/packages/tls/native/registration.rs
      - name: Build
        run: cargo build --locked
      - name: Check Zore formatting
        if: needs.routes.outputs.full == 'true' && runner.os == 'Linux'
        run: target/debug/zore fmt --check .
      - name: Documentation
        if: needs.routes.outputs.full == 'true'
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Show native toolchain (clang LLVM 15+ and rustc 1.98+)
        run: |
          clang --version
          rustc --version
      - name: Regex differential oracle
        if: needs.routes.outputs.full == 'true'
        run: python tests/hardening/regexp_oracle.py
      - name: Gzip interoperability oracle
        if: needs.routes.outputs.full == 'true'
        run: python tests/hardening/gzip_oracle.py
      - name: Archive interoperability oracle
        if: needs.routes.outputs.full == 'true'
        run: python tests/hardening/archive_oracle.py
      - name: Extraction interoperability and rollback oracle
        if: needs.routes.outputs.full == 'true'
        run: python tests/hardening/extraction_oracle.py
      - name: HTML escaping oracle
        if: needs.routes.outputs.full == 'true'
        run: python tests/hardening/html_oracle.py
      - name: Networking interoperability oracle
        if: needs.routes.outputs.full == 'true'
        run: python tests/hardening/networking_oracle.py
      - name: Python harness tests
        shell: bash
        run: |
          status=0
          for directory in benchmarks/*/; do
            compgen -G "${directory}test_*.py" > /dev/null || continue
            python -m unittest discover -s "$directory" -p 'test_*.py' || status=1
          done
          exit $status
        env:
          ZORE_SCALING_COMPILER: ${{ github.workspace }}/target/debug/zore${{ runner.os == 'Windows' && '.exe' || '' }}

  tests:
    needs: routes
    if: needs.routes.outputs.full == 'true'
    name: Tests (${{ matrix.os }}, shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Configure Windows native toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select Windows clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"ZORE_CC=C:\Program Files\LLVM\bin\clang.exe" >> $env:GITHUB_ENV'
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Test runner regressions
        run: python -m unittest discover -s .github/scripts -p test_ci_tests.py
      - name: Test shard
        run: python .github/scripts/ci_tests.py --shard ${{ matrix.shard }} --shards 2 --output ci-test-results
      - name: Upload test timings and inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: ci-test-results
          if-no-files-found: error

  docs:
    name: Documentation checks
    needs: routes
    if: needs.routes.outputs.docs == 'true' && needs.routes.outputs.full == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo build --locked
      - run: target/debug/zore fmt --check .
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  check:
    name: Rust checks (${{ matrix.os }})
    if: always()
    needs: [routes, validation, tests, docs, imports]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Require every selected check
        env:
          ROUTES_RESULT: ${{ needs.routes.result }}
          FULL: ${{ needs.routes.outputs.full }}
          DOCS: ${{ needs.routes.outputs.docs }}
          BENCHMARKS: ${{ needs.routes.outputs.benchmarks }}
          DISTRIBUTION: ${{ needs.routes.outputs.distribution }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          IMPORTS_RESULT: ${{ needs.imports.result }}
        run: python .github/scripts/ci_routing.py --gate

  imports:
    name: Python imports (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Import every Python module
        run: python .github/scripts/import_modules.py
