name: Runtime scaling measurements

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: runtime-scaling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-scaling-benchmarks')
    name: Runtime populations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure Windows native toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Select Windows clang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"ZORE_CC=C:\Program Files\LLVM\bin\clang.exe" >> $env:GITHUB_ENV'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install sampler
        run: python -m pip install psutil==7.2.2
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Build compiler
        run: cargo build --locked --release
      - name: Validate scaling harness
        run: python -m unittest discover -s benchmarks/runtime-scaling -p 'test_*.py'
      - name: Measure populations and cleanup
        run: >-
          python benchmarks/runtime-scaling/run.py
          --compiler "${{ github.workspace }}/target/release/zore${{ runner.os == 'Windows' && '.exe' || '' }}"
          --compiler-revision "${{ github.sha }}"
          --output "runtime-scaling-${{ runner.os }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime-scaling-${{ runner.os }}-${{ github.sha }}
          path: runtime-scaling-*.json
          if-no-files-found: warn
